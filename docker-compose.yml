services:
  # ==================== Database ====================
  db:
    image: postgres:16-alpine
    container_name: foodihub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-foodihub}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - foodihub_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis (Cache) ====================
  redis:
    image: redis:7-alpine
    container_name: foodihub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - foodihub_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Backend API ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodihub_backend
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - foodihub_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3333/health" ]
      interval: 15s
      timeout: 5s
      retries: 5

# ==================== Volumes ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ==================== Networks ====================
networks:
  foodihub_network:
    external: true
